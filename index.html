<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6a4aa8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="あんざん">
  <meta name="format-detection" content="telephone=no">
  <title>あんざんドリル</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="device">
    <header class="top">
      <div class="brand">あんざん<span>ドリル</span></div>
      <div class="lamps" aria-hidden="true">
        <div class="lamp lamp-ok" id="lamp-ok"><i></i><small>せいかい</small></div>
        <div class="lamp lamp-ng" id="lamp-ng"><i></i><small>まちがい</small></div>
      </div>
      <button class="sound-btn" id="btn-sound" data-key="sound" aria-label="おと">🔊</button>
    </header>

    <section class="lcd" aria-live="polite">
      <div class="lcd-status">
        <span id="lcd-mode"></span>
        <span id="lcd-info"></span>
      </div>
      <div class="lcd-main" id="lcd-main"></div>
      <div class="lcd-sub" id="lcd-sub"></div>
      <div class="lcd-hint" id="lcd-hint"></div>
      <div class="lcd-bar"><i id="lcd-bar"></i></div>
    </section>

    <div class="row ops">
      <button class="key op op-add" data-key="add">＋</button>
      <button class="key op op-sub" data-key="sub">－</button>
      <button class="key op op-mul" data-key="mul">×</button>
      <button class="key op op-div" data-key="div">÷</button>
    </div>

    <div class="row funcs">
      <button class="key fn fn-mini" data-key="mini">ミニゲーム</button>
      <button class="key fn fn-time" data-key="time">タイムアタック<small id="time-label">なし</small></button>
    </div>

    <div class="pad">
      <button class="key num" data-key="7">7</button>
      <button class="key num" data-key="8">8</button>
      <button class="key num" data-key="9">9</button>
      <button class="key num" data-key="4">4</button>
      <button class="key num" data-key="5">5</button>
      <button class="key num" data-key="6">6</button>
      <button class="key num" data-key="1">1</button>
      <button class="key num" data-key="2">2</button>
      <button class="key num" data-key="3">3</button>
      <button class="key clr" data-key="clear">とりけし</button>
      <button class="key num" data-key="0">0</button>
      <button class="key ok" data-key="ok">OK</button>
    </div>
  </main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
